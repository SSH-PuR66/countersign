name: Authorization regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -B verify.py
      - run: python -B -m unittest -v campaign_checks
      - run: python -B adversarial_campaign.py --rounds 64
      - run: python -B -m unittest -v contention_checks
      - run: python -B contention_campaign.py --rounds 16 --workers 8
